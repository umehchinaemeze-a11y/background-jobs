services:
  postgres:
    image: postgres:16-alpine
    container_name: background-jobs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      - "15435:5432"
    volumes:
      - background-jobs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  background-jobs-pgdata: